<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111318">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Demir Kafa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700&display=swap">
<style>
/* Layout: one pixel-art canvas (scaled crisp), DOM HUD on top, touch pads at the bottom, one overlay card for menus. Single dark look by design. */
:root {
  --bg: #111318;
  --panel: rgba(22, 25, 32, 0.94);
  --hazard: #ffc21a;
  --vest: #ff7a1a;
  --ink: #f1f0ea;
  --muted: #a4a9b4;
  --slime: #6fe04a;
  --danger: #ff4d4d;
  --display: "Bungee", "Impact", system-ui, sans-serif;
  --body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body);
  overflow: hidden; touch-action: none; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
#c { position: fixed; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }

#hud {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  font-family: var(--display); font-size: 14px; line-height: 1;
  text-shadow: 0 2px 0 #000; pointer-events: none;
}
.hud-l, .hud-r { display: flex; align-items: center; gap: 12px; }
.hp { width: clamp(70px, 18vw, 140px); height: 12px; background: #2a1418; border: 2px solid #000; box-shadow: 0 2px 0 #000; }
.hp i { display: block; height: 100%; width: 100%; background: linear-gradient(#7dff6a, #2fb83a); transition: width .15s; }
.hp.low i { background: linear-gradient(#ff8a7a, #d02a2a); }
#key { color: #6ec8ff; }
#weapon { color: var(--hazard); }
#msg {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 40px); transform: translateX(-50%);
  font-family: var(--display); font-size: clamp(14px, 3.6vw, 22px); color: var(--hazard);
  text-shadow: 0 3px 0 #000; white-space: nowrap; pointer-events: none; text-align: center;
}
#bossbar {
  position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 72px);
  width: min(60vw, 360px); font-family: var(--display); font-size: 12px; color: var(--slime);
  text-shadow: 0 2px 0 #000; pointer-events: none; display: grid; gap: 4px; text-align: center;
}
#bossbar div { height: 10px; border: 2px solid #000; background: #1a2a14; }
#bossbar i { display: block; height: 100%; width: 100%; background: linear-gradient(#b6ff6a, #3aa02a); }

.topbtns { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 32px); display: flex; gap: 8px; }
.topbtns button {
  width: 36px; height: 36px; border-radius: 8px; border: 2px solid #000; background: rgba(30,34,42,.8);
  color: var(--ink); font: 14px var(--display); cursor: pointer; display: grid; place-items: center; padding: 0;
}
.topbtns button:focus-visible { outline: 2px solid var(--hazard); }

#touch { position: fixed; inset: auto 0 0 0; pointer-events: none;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(16px, env(safe-area-inset-left, 0px));
  display: flex; justify-content: space-between; align-items: flex-end; }
.pad { display: flex; gap: 10px; align-items: flex-end; }
.pad button {
  pointer-events: auto; touch-action: none;
  width: 64px; height: 64px; border-radius: 16px;
  background: rgba(255,255,255,.10); border: 2px solid rgba(255,255,255,.28); color: rgba(255,255,255,.85);
  font: 12px var(--display); display: grid; place-items: center; padding: 0;
}
.pad button svg { width: 26px; height: 26px; fill: currentColor; }
.pad button.big { width: 76px; height: 76px; border-radius: 50%; font-size: 13px; }
.pad button.fire { background: rgba(255,122,26,.28); border-color: rgba(255,160,90,.6); }
.pad button.jump { background: rgba(255,194,26,.22); border-color: rgba(255,210,90,.6); margin-bottom: 34px; }
.pad button.sm { width: 52px; height: 40px; border-radius: 10px; font-size: 10px; }
.pad button.on { background: rgba(255,255,255,.35); transform: scale(.95); }
@media (orientation: portrait) {
  .pad { gap: 8px; position: relative; }
  .pad button { width: 56px; height: 56px; }
  .pad button.big { width: 68px; height: 68px; }
  .pad button.jump { margin-bottom: 28px; }
  .pad button.sm { position: absolute; left: 0; top: -48px; width: 56px; height: 36px; }
}

.overlay {
  position: fixed; inset: 0; display: grid; place-items: center; overflow-y: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(8, 9, 12, 0.6); backdrop-filter: blur(2px);
}
.card {
  width: min(100%, 30rem); display: grid; gap: 14px; padding: 22px 20px 20px;
  background: var(--panel); border: 3px solid #000; border-radius: 14px; text-align: center;
  box-shadow: 0 6px 0 #000; position: relative; overflow: hidden;
}
.card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 8px;
  background: repeating-linear-gradient(-45deg, var(--hazard) 0 12px, #111 12px 24px); }
h1 { font-family: var(--display); font-weight: 400; margin: 6px 0 0; line-height: .95;
  font-size: clamp(2.2rem, 10vw, 3.6rem); color: var(--hazard); text-shadow: 0 4px 0 #8a4a00, 0 7px 0 #000; }
h2 { font-family: var(--display); font-weight: 400; margin: 4px 0 0; font-size: clamp(1.5rem, 7vw, 2.2rem); color: var(--hazard); text-shadow: 0 3px 0 #000; }
.tag { margin: 0; color: var(--muted); line-height: 1.4; }
.ctl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; text-align: left; margin: 0; font-size: .92rem; }
.ctl dt { font-family: var(--display); font-size: .78rem; color: var(--hazard); white-space: nowrap; padding-top: 2px; }
.ctl dd { margin: 0; color: var(--ink); }
.big { font-family: var(--display); font-size: 2.6rem; margin: 0; color: var(--ink); font-variant-numeric: tabular-nums; }
.stat { margin: 0; color: var(--muted); font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
button.play {
  font-family: var(--display); font-size: 1.3rem; padding: 14px 22px; border: 3px solid #000; border-radius: 12px;
  background: var(--vest); color: #1a0d00; cursor: pointer; box-shadow: 0 5px 0 #000;
}
button.play:active { transform: translateY(3px); box-shadow: 0 2px 0 #000; }
button.play:focus-visible, button.ghost:focus-visible { outline: 3px solid var(--hazard); outline-offset: 3px; }
button.ghost { background: transparent; color: var(--muted); border: 2px solid #3a3f4a; border-radius: 10px; padding: 10px 16px; font: 700 .9rem var(--body); cursor: pointer; }
.only-touch { display: none; }
body.touch .only-touch { display: block; }
body.touch .only-kb { display: none; }
@media (max-height: 420px) { .card { gap: 10px; padding: 18px 16px 16px; } h1 { font-size: 2.2rem; } .ctl { font-size: .82rem; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="hud-l"><div class="hp" id="hp"><i id="hpFill"></i></div><span id="lives">♥3</span></div>
  <div class="hud-r"><span id="key" hidden>KART</span><span id="weapon">PERÇİN</span><span id="bolts">⚙0</span><span id="score">0</span></div>
</div>
<div id="msg"></div>
<div id="bossbar" hidden><span>DR. BALÇIK</span><div><i id="bossFill"></i></div></div>
<div class="topbtns" id="topbtns" hidden>
  <button id="muteBtn" type="button" aria-label="Sesi aç/kapat">♪</button>
  <button id="pauseBtn" type="button" aria-label="Duraklat">II</button>
</div>

<div id="touch" hidden>
  <div class="pad">
    <button data-a="left" aria-label="Sol"><svg viewBox="0 0 24 24"><path d="M16 4 6 12l10 8z"/></svg></button>
    <button data-a="down" aria-label="Aşağı"><svg viewBox="0 0 24 24"><path d="M4 8l8 10 8-10z"/></svg></button>
    <button data-a="right" aria-label="Sağ"><svg viewBox="0 0 24 24"><path d="M8 4l10 8-10 8z"/></svg></button>
  </div>
  <div class="pad">
    <button data-a="swap" class="sm">SİLAH</button>
    <button data-a="fire" class="big fire">ATEŞ</button>
    <button data-a="jump" class="big jump">ZIPLA</button>
  </div>
</div>

<div class="overlay" id="ov"><div class="card" id="card"></div></div>

<script>
(() => {
'use strict';
const TS = 16, VH = 272;
const $ = id => document.getElementById(id);
const cv = $('c'), g = cv.getContext('2d');
let VW = 480, SC = 1;

function resize() {
  const sw = innerWidth, sh = innerHeight;
  SC = sh / VH; VW = Math.ceil(sw / SC);
  if (VW < 340) { VW = 340; SC = sw / 340; }
  cv.width = VW; cv.height = VH;
  const dw = VW * SC, dh = VH * SC;
  cv.style.width = dw + 'px'; cv.style.height = dh + 'px';
  cv.style.left = ((sw - dw) / 2) + 'px';
  cv.style.top = ((sh - dh) * (sh > sw ? 0.32 : 0.5)) + 'px';
  g.imageSmoothingEnabled = false;
}
addEventListener('resize', resize); resize();

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function hash(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return (h ^ (h >>> 16)) >>> 0; }
function rng(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// ---------- storage ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let best = store.get('demirkafa.best', 0);
let muted = store.get('demirkafa.muted', false);

// ---------- audio ----------
let actx = null, master, sfxG, musG, noiseBuf;
function ensureAudio() {
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = muted ? 0 : 0.55; master.connect(actx.destination);
      sfxG = actx.createGain(); sfxG.gain.value = 0.9; sfxG.connect(master);
      musG = actx.createGain(); musG.gain.value = 0.28; musG.connect(master);
      noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(type, f0, f1, dur, vol, dest, t) {
  if (!actx) return; t = t || actx.currentTime; dest = dest || sfxG;
  const o = actx.createOscillator(), gn = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(gn); gn.connect(dest); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, freq, dest, t) {
  if (!actx) return; t = t || actx.currentTime; dest = dest || sfxG;
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(Math.max(60, freq * 0.2), t + dur);
  const gn = actx.createGain(); gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  s.connect(f); f.connect(gn); gn.connect(dest); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
function sfx(n) {
  if (!actx) return; const t = actx.currentTime;
  switch (n) {
    case 'shoot': tone('square', 900, 240, 0.07, 0.07); break;
    case 'scatter': noise(0.18, 0.35, 3000); tone('square', 220, 80, 0.12, 0.08); break;
    case 'laser': tone('sawtooth', 1500, 700, 0.06, 0.05); break;
    case 'jump': tone('square', 280, 620, 0.1, 0.05); break;
    case 'hit': tone('square', 240, 120, 0.05, 0.06); break;
    case 'kill': noise(0.2, 0.25, 1800); tone('sine', 400, 60, 0.2, 0.12); break;
    case 'hurt': tone('sawtooth', 220, 70, 0.28, 0.12); break;
    case 'pick': [660, 880, 1320].forEach((f, i) => tone('triangle', f, f, 0.08, 0.1, sfxG, t + i * 0.05)); break;
    case 'power': [440, 554, 660, 880, 1108].forEach((f, i) => tone('square', f, f, 0.09, 0.06, sfxG, t + i * 0.06)); break;
    case 'boom': noise(0.7, 0.6, 900); tone('sine', 120, 30, 0.5, 0.3); break;
    case 'eshot': tone('triangle', 500, 200, 0.12, 0.06); break;
    case 'splat': noise(0.12, 0.2, 700); break;
    case 'cat': tone('triangle', 900, 1400, 0.12, 0.09); tone('triangle', 1400, 800, 0.18, 0.08, sfxG, t + 0.12); break;
    case 'clear': [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone('square', f, f, 0.14, 0.07, sfxG, t + i * 0.11)); break;
    case 'deny': tone('square', 160, 150, 0.15, 0.07); tone('square', 120, 110, 0.2, 0.07, sfxG, t + 0.16); break;
    case 'die': [400, 300, 220, 150, 90].forEach((f, i) => tone('square', f, f * 0.9, 0.14, 0.08, sfxG, t + i * 0.12)); break;
  }
}
// music: tiny step sequencer
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
const SONGS = [
  { bpm: 138, bass: [45,0,45,57,45,0,48,50, 43,0,43,55,43,0,47,48], lead: [0,0,69,0,72,0,74,0, 0,0,67,0,71,0,72,74] },
  { bpm: 126, bass: [40,0,40,52,40,43,0,45, 38,0,38,50,38,41,0,43], lead: [64,0,0,67,0,0,69,0, 62,0,0,65,0,0,67,0] },
  { bpm: 148, bass: [42,42,54,42,45,45,57,45, 40,40,52,40,47,47,59,47], lead: [66,0,69,0,73,0,69,0, 64,0,67,0,71,0,74,0] },
  { bpm: 168, bass: [38,38,50,38,41,41,53,41, 36,36,48,36,43,43,55,44], lead: [74,0,77,74,0,72,0,70, 72,0,74,0,77,0,79,0] },
];
let song = 0, step = 0, nextT = 0, musicOn = false;
setInterval(() => {
  if (!actx || !musicOn || muted) return;
  const S = SONGS[song], dur = 60 / S.bpm / 2;
  if (nextT < actx.currentTime) nextT = actx.currentTime + 0.05;
  while (nextT < actx.currentTime + 0.15) {
    const i = step % 16, b = S.bass[i], l = S.lead[i];
    if (b) tone('square', midi(b), midi(b), dur * 0.9, 0.12, musG, nextT);
    if (l && (step >> 4) % 2 === 1) tone('triangle', midi(l), midi(l), dur * 1.6, 0.11, musG, nextT);
    if (i % 4 === 0) tone('sine', 140, 40, 0.12, 0.35, musG, nextT);
    if (i % 8 === 4) noise(0.1, 0.25, 4000, musG, nextT);
    if (i % 2 === 1) noise(0.03, 0.08, 9000, musG, nextT);
    nextT += dur; step++;
  }
}, 40);

// ---------- input ----------
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowDown: 'down', KeyS: 'down',
  ArrowUp: 'jump', KeyW: 'jump', Space: 'jump', KeyZ: 'jump', KeyK: 'jump',
  KeyX: 'fire', KeyJ: 'fire', ControlLeft: 'fire', ControlRight: 'fire',
  KeyC: 'swap', KeyQ: 'swap', KeyL: 'swap', Tab: 'swap', KeyP: 'pause', Escape: 'pause', KeyM: 'mute' };
const kb = {}, tch = {}, held = {}, pq = {};
function syncHeld() { for (const a of ['left', 'right', 'down', 'jump', 'fire']) held[a] = !!(kb[a] || tch[a]); }
addEventListener('keydown', e => {
  ensureAudio();
  if (!ov.hidden && (e.code === 'Enter' || e.code === 'Space')) { const b = card.querySelector('.play'); if (b) { e.preventDefault(); b.click(); } return; }
  if (e.code === 'Enter' && state === 'play') { e.preventDefault(); pause(); return; }
  const a = KEYMAP[e.code]; if (!a) return; e.preventDefault();
  if (e.repeat) return;
  if (a === 'pause') { if (state === 'play') pause(); else if (state === 'paused') resume(); return; }
  if (a === 'mute') { toggleMute(); return; }
  kb[a] = true; pq[a] = true; syncHeld();
});
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) { kb[a] = false; syncHeld(); } });
addEventListener('blur', () => { for (const k in kb) kb[k] = false; syncHeld(); });

const touchEl = $('touch'), tpoint = new Map();
function actAt(x, y) { const el = document.elementFromPoint(x, y); const b = el && el.closest && el.closest('#touch [data-a]'); return b ? b.dataset.a : null; }
function syncTouch() {
  for (const k in tch) tch[k] = false;
  for (const a of tpoint.values()) if (a) tch[a] = true;
  touchEl.querySelectorAll('[data-a]').forEach(b => b.classList.toggle('on', !!tch[b.dataset.a]));
  syncHeld();
}
function enableTouch() { if (!document.body.classList.contains('touch')) { document.body.classList.add('touch'); refreshChrome(); } }
touchEl.addEventListener('pointerdown', e => {
  e.preventDefault(); ensureAudio(); enableTouch();
  const a = actAt(e.clientX, e.clientY); tpoint.set(e.pointerId, a); if (a) pq[a] = true; syncTouch();
});
addEventListener('pointermove', e => {
  if (!tpoint.has(e.pointerId)) return;
  const a = actAt(e.clientX, e.clientY);
  if (a !== tpoint.get(e.pointerId)) { tpoint.set(e.pointerId, a); if (a && a !== 'swap') pq[a] = true; syncTouch(); }
}, { passive: true });
const endPtr = e => { if (tpoint.delete(e.pointerId)) syncTouch(); };
addEventListener('pointerup', endPtr); addEventListener('pointercancel', endPtr);
addEventListener('touchstart', () => enableTouch(), { passive: true, once: true });
if (matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');
touchEl.addEventListener('contextmenu', e => e.preventDefault());

// ---------- levels ----------
function Builder(w, h) {
  const grid = Array.from({ length: h }, () => Array(w).fill(' ')), sp = [];
  const o = {
    w, h, grid, sp,
    fill(x0, y0, x1, y1, c = '#') { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (x >= 0 && x < w && y >= 0 && y < h) grid[y][x] = c; },
    ground(x0, x1, top, c = '#') { o.fill(x0, top, x1, h - 1, c); },
    plat(x0, x1, y) { o.fill(x0, y, x1, y, '-'); },
    e(type, x, y) { sp.push({ type, x, y }); },
    row(type, x0, x1, y) { for (let x = x0; x <= x1; x++) o.e(type, x, y); },
  };
  return o;
}

const LEVELS = [
  { name: 'BÖLÜM 1', title: 'Gökdelen Çatıları', goal: 'Mavi kart anahtarı bul, çatıdaki çıkış kapısına ulaş.', theme: 0, needKey: true, song: 0,
    build() {
      const b = Builder(212, 17);
      [[0,22,13],[26,44,12],[48,62,13],[66,82,11],[86,102,13],[106,122,12],[126,142,10],[146,162,13],[166,181,12],[188,211,12]].forEach(s => b.ground(...s));
      b.fill(12,11,13,12); b.fill(36,9,38,11); b.fill(56,11,57,12); b.fill(94,10,95,12); b.fill(114,9,116,11); b.fill(155,11,156,12); b.fill(198,9,199,11);
      b.plat(20,28,10); b.plat(42,50,9); b.plat(60,68,8); b.plat(79,88,8); b.plat(100,108,9); b.plat(120,129,9); b.plat(140,148,7); b.plat(160,168,9); b.plat(180,189,9);
      b.fill(17,12,17,12,'c'); b.fill(70,10,71,10,'c'); b.fill(70,9,70,9,'c'); b.fill(133,9,134,9,'c'); b.fill(172,11,172,11,'c');
      b.fill(109,11,111,11,'^');

function mk(type, kind, tx, ty, w, h, extra) {

}
function mkEnemy(type, tx, ty) {

  return mk(type, 'enemy', tx, ty, d.w, d.h, { hp: d.hp, max: d.hp, dir: Math.random() < 0.5 ? -1 : 1, fire: 1 + Math.random(), flash: 0, awake: false });
}

function loadLevel(i) {

// ---------- tiles / physics ----------
const isSolidC = c => c === '#' || c === 'T' || c === 'M' || c === 'c';
function tile(tx, ty) { if (tx < 0 || tx >= LW) return '#'; if (ty < 0 || ty >= LH) return ' '; return grid[ty][tx]; }
const isSolid = (tx, ty) => isSolidC(tile(tx, ty));
function solidProp(e, x0, y0, x1, y1) {
  for (const p of ents) if (p.solid && p !== e && x0 < p.x + p.w && x1 > p.x && y0 < p.y + p.h && y1 > p.y) return p;
  return null;
}
function moveBody(e, dt, drop) {
  e.hitWall = false;
  const dx = e.vx * dt; e.x += dx;
  const y0 = Math.floor(e.y / TS), y1 = Math.floor((e.y + e.h - 0.01) / TS);
  if (dx > 0) {
    const tx = Math.floor((e.x + e.w - 0.01) / TS);
    for (let ty = y0; ty <= y1; ty++) if (isSolid(tx, ty)) { e.x = tx * TS - e.w; e.hitWall = true; break; }
  } else if (dx < 0) {
    const tx = Math.floor(e.x / TS);
    for (let ty = y0; ty <= y1; ty++) if (isSolid(tx, ty)) { e.x = (tx + 1) * TS; e.hitWall = true; break; }
  }
  if (dx !== 0 && e.kind !== 'prop') {
    const p = solidProp(e, e.x, e.y, e.x + e.w, e.y + e.h - 2);
    if (p) { if (dx > 0) e.x = p.x - e.w; else e.x = p.x + p.w; e.hitWall = true; }
  }
  const prevB = e.y + e.h;
  e.y += e.vy * dt; e.onGround = false;
  const x0 = Math.floor(e.x / TS), x1 = Math.floor((e.x + e.w - 0.01) / TS);
  if (e.vy > 0) {
    const ty = Math.floor((e.y + e.h - 0.01) / TS);
    for (let tx = x0; tx <= x1; tx++) {
      const c = tile(tx, ty);
      if (isSolidC(c) || (c === '-' && !drop && prevB <= ty * TS + 0.01)) { e.y = ty * TS - e.h; e.vy = 0; e.onGround = true; break; }
    }
    if (!e.onGround && e.kind !== 'prop') {
      for (const p of ents) if (p.solid && p !== e && e.x < p.x + p.w && e.x + e.w > p.x && prevB <= p.y + 0.01 && e.y + e.h > p.y) { e.y = p.y - e.h; e.vy = 0; e.onGround = true; break; }
    }
  } else if (e.vy < 0) {
    const ty = Math.floor(e.y / TS);
    for (let tx = x0; tx <= x1; tx++) if (isSolid(tx, ty)) { e.y = (ty + 1) * TS; e.vy = 0; break; }
  }
}
function onPlatformOnly(e) {
  const ty = Math.floor((e.y + e.h + 1) / TS); let plat = false;
  for (let tx = Math.floor(e.x / TS); tx <= Math.floor((e.x + e.w - 0.01) / TS); tx++) { const c = tile(tx, ty); if (isSolidC(c)) return false; if (c === '-') plat = true; }
  return plat;
}
function groundAhead(e) {
  const fx = e.dir > 0 ? e.x + e.w + 1 : e.x - 1, tx = Math.floor(fx / TS);
  const below = tile(tx, Math.floor((e.y + e.h + 2) / TS)), at = tile(tx, Math.floor((e.y + e.h - 2) / TS));
  return (isSolidC(below) || below === '-') && at !== '^';
}

// ---------- effects ----------
function burst(x, y, n, colors, sp = 120, life = 0.5, grav = 300, size = 2) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = rnd(sp * 0.3, sp);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - sp * 0.3, life: rnd(life * 0.5, life), max: life, c: colors[i % colors.length], s: size, g: grav });
  }
}
function popText(x, y, t, c = '#ffc21a') { texts.push({ x, y, t, c, life: 0.9 }); }
let msgEl = $('msg');
function say(t, dur = 2) { msgEl.textContent = t; msgT = dur; }

function hurt(dmg, srcX) {
  if (P.inv > 0 || P.dead) return;
  P.hp -= dmg; P.inv = 1.1; P.vx = (P.x + P.w / 2 < srcX ? -1 : 1) * 190; P.vy = -200;
  sfx('hurt'); shake = Math.max(shake, 4);
  burst(P.x + P.w / 2, P.y + 10, 8, ['#ff4d4d', '#ffd0a0']);
  if (P.hp <= 0) die();
}
function die() {
  if (P.dead) return;
  P.dead = true; P.hp = 0; lives--; deathT = 1.8; sfx('die');
  burst(P.x + P.w / 2, P.y + 10, 30, ['#ff7a1a', '#f5c400', '#2c4a86', '#e3a574'], 200, 1, 400, 3);
}
function damageEnemy(e, dmg) {
  if (e.dead || e.dying) return;
  e.hp -= dmg; e.flash = 0.08;
  if (e.hp <= 0) {
    if (e.type === 'boss') { e.dying = 2.6; e.vx = 0; sfx('boom'); shake = 10; return; }
    e.dead = true; score += DEF[e.type].score; sfx('kill');
    popText(e.x + e.w / 2, e.y, '+' + DEF[e.type].score);
    burst(e.x + e.w / 2, e.y + e.h / 2, 18, ['#6fe04a', '#3aa02a', '#b6ff6a', e.type === 'soldier' ? '#6a3d9a' : '#c8ffb0'], 160);
    if (Math.random() < 0.35) ents.push(mk('$', 'pick', 0, 0, 10, 10, { x: e.x + e.w / 2 - 5, y: e.y + e.h - 12, by: 0 }));
    else if (Math.random() < 0.08) ents.push(mk('a', 'pick', 0, 0, 12, 10, { x: e.x + e.w / 2 - 6, y: e.y + e.h - 12, by: 0 }));
  } else sfx('hit');
}
function hitCrate(tx, ty, dmg) {
  const k = tx + ',' + ty, hp = (crateHp.has(k) ? crateHp.get(k) : 3) - dmg;
  if (hp > 0) { crateHp.set(k, hp); sfx('hit'); burst(tx * TS + 8, ty * TS + 8, 3, ['#c88a4a', '#6a4220'], 60, 0.3); return; }
  crateHp.delete(k); grid[ty][tx] = ' '; score += 20; sfx('splat');
  burst(tx * TS + 8, ty * TS + 8, 14, ['#c88a4a', '#a06a32', '#6a4220'], 150, 0.7, 500, 3);
  const r = Math.random(), x = tx * TS + 3, y = ty * TS + 4;
  if (r < 0.18) ents.push(mk('h', 'pick', 0, 0, 12, 12, { x, y: ty * TS + 4, by: 0 }));
  else if (r < 0.4) ents.push(mk('a', 'pick', 0, 0, 12, 10, { x, y: ty * TS + 6, by: 0 }));
  else if (r < 0.8) for (let i = 0; i < 3; i++) ents.push(mk('$', 'pick', 0, 0, 10, 10, { x: x - 8 + i * 8, y: ty * TS + 6, by: 0 }));
}
function explode(cx, cy, r = 46) {
  sfx('boom'); shake = Math.max(shake, 8);
  burst(cx, cy, 40, ['#fff2a0', '#ffc21a', '#ff7a1a', '#ff3a1a', '#555'], 240, 0.9, 120, 3);
  for (const e of ents) {
    const d = Math.hypot(e.x + e.w / 2 - cx, e.y + e.h / 2 - cy);
    if (d > r) continue;
    if (e.kind === 'enemy') damageEnemy(e, e.type === 'boss' ? 4 : 8);
    else if (e.type === 'barrel' && !e.dead) { e.hp = 0; e.fuse = 0.15; }
    else if (e.type === 'cage') hitProp(e, 9);
  }
  if (!P.dead && Math.hypot(P.x + P.w / 2 - cx, P.y + P.h / 2 - cy) < r) hurt(30, cx);
  for (let ty = Math.floor((cy - r) / TS); ty <= Math.floor((cy + r) / TS); ty++)
    for (let tx = Math.floor((cx - r) / TS); tx <= Math.floor((cx + r) / TS); tx++)
      if (tile(tx, ty) === 'c' && Math.hypot(tx * TS + 8 - cx, ty * TS + 8 - cy) < r) hitCrate(tx, ty, 9);
}
function hitProp(e, dmg) {
  if (e.dead) return;
  if (e.type === 'barrel') { e.hp -= dmg; e.flash = 0.08; if (e.hp <= 0 && !e.fuse) e.fuse = 0.05; else sfx('hit'); }
  else if (e.type === 'cage') {
    e.hp -= dmg; e.flash = 0.08; sfx('hit');
    if (e.hp <= 0) {
      e.dead = true; score += 500; sfx('cat'); popText(e.x + 8, e.y - 4, 'MİYAV! +500', '#ffb36a');
      burst(e.x + 8, e.y + 8, 12, ['#9aa4b0', '#5a6670'], 140, 0.6, 500, 2);
      parts.push({ cat: true, x: e.x + 4, y: e.y + 6, vx: (P.x < e.x ? 1 : -1) * 110, vy: -160, life: 2.5, max: 2.5 });
    }
  }
}

// ---------- shooting ----------
function shoot() {
  const w = arms.w, f = P.face, mx = f > 0 ? P.x + P.w + 4 : P.x - 8, my = P.y + 11;
  if (w === 0) { bullets.push({ x: mx, y: my, w: 5, h: 2, vx: f * 380, vy: 0, life: 0.7, dmg: 1, k: 0 }); P.cd = 0.19; sfx('shoot'); }
  else if (w === 1) {
    for (let i = -2; i <= 2; i++) bullets.push({ x: mx, y: my, w: 3, h: 2, vx: f * rnd(320, 380), vy: i * 55 + rnd(-15, 15), life: rnd(0.22, 0.32), dmg: 1, k: 1 });
    P.cd = 0.5; arms.ammo[1]--; P.vx -= f * 70; shake = Math.max(shake, 2); sfx('scatter');
  } else {
    bullets.push({ x: mx - 4, y: my, w: 12, h: 2, vx: f * 540, vy: 0, life: 0.55, dmg: 2, k: 2, pierce: 3, hits: new Set() });
    P.cd = 0.09; arms.ammo[2]--; sfx('laser');
  }
  P.recoil = 0.07;
  parts.push({ x: mx + (f > 0 ? 2 : 2), y: my + 1, vx: 0, vy: 0, life: 0.05, max: 0.05, c: '#fff2a0', s: 4, g: 0 });
  if (w > 0 && arms.ammo[w] <= 0) { arms.w = 0; say('MERMİ BİTTİ'); }
}
function swapWeapon() {
  for (let i = 1; i <= 3; i++) { const n = (arms.w + i) % 3; if (arms.has[n] && arms.ammo[n] > 0) { if (n !== arms.w) { arms.w = n; sfx('pick'); } return; } }
}

// ---------- update ----------
function update(dt) {
  time += dt;
  if (msgT > 0) { msgT -= dt; if (msgT <= 0) msgEl.textContent = ''; }
  doorNag -= dt;
  if (P.dead) {
    deathT -= dt;
    if (deathT <= 0) {
      if (lives > 0) { spawnPlayer(); if (bossOn && boss && !boss.dead) { boss.hp = Math.min(boss.max, boss.hp + 15); } }
      else gameOver();
    }
  } else updatePlayer(dt);

  for (const e of ents) {
    if (e.dead) continue;
    if (!e.awake && e.kind === 'enemy') { if (e.x < cam.x + VW + 48 && e.x + e.w > cam.x - 48) e.awake = true; else continue; }
    if (e.kind === 'enemy') updateEnemy(e, dt);
    else if (e.kind === 'pick') updatePick(e, dt);
    else updateProp(e, dt);
  }
  ents = ents.filter(e => !e.dead);
  updateBullets(dt);
  for (const p of parts) {
    p.life -= dt;
    if (p.cat) { p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt; const ty = Math.floor((p.y + 8) / TS); if (p.vy > 0 && isSolid(Math.floor((p.x + 4) / TS), ty)) { p.y = ty * TS - 8; p.vy = -120; } continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
  parts = parts.filter(p => p.life > 0);
  for (const t of texts) { t.life -= dt; t.y -= 22 * dt; }
  texts = texts.filter(t => t.life > 0);

  if (lv.boss && !bossOn && !P.dead && P.x > lv.boss.trigger * TS) startBoss();

  // camera
  const tx = P.x + P.w / 2 - VW * 0.42 + P.face * 26;
  cam.x += (tx - cam.x) * Math.min(1, dt * 5);
  const minX = bossOn ? Math.min(camMin, LW * TS - VW) : 0;
  cam.x = clamp(cam.x, minX, Math.max(0, LW * TS - VW));
  cam.y = clamp(P.y - VH * 0.5, 0, LH * TS - VH);
  shake = Math.max(0, shake - dt * 20);
}

function updatePlayer(dt) {
  const p = P;
  p.inv -= dt; p.cd -= dt; p.recoil -= dt; p.drop -= dt;
  const ax = (held.right ? 1 : 0) - (held.left ? 1 : 0);
  if (ax) { p.vx += ax * (p.onGround ? 1500 : 950) * dt; p.face = ax; }

// ---------- screens ----------
const ov = $('ov'), card = $('card');
function show(html) { card.innerHTML = html; ov.hidden = false; refreshChrome(); const b = card.querySelector('.play'); if (b && !document.body.classList.contains('touch')) b.focus({ preventScroll: true }); }
function hide() { ov.hidden = true; refreshChrome(); }
function refreshChrome() {
  const playing = state === 'play';
  $('touch').hidden = !(playing && document.body.classList.contains('touch'));
  $('topbtns').hidden = !playing;
  $('hud').style.visibility = (state === 'title') ? 'hidden' : 'visible';
  musicOn = playing;
}
card.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  ensureAudio();
  const a = b.dataset.act;
  if (a === 'start') newGame();
  else if (a === 'go') { state = 'play'; hide(); say(lv.title.toUpperCase(), 2); }
  else if (a === 'resume') resume();
  else if (a === 'next') { loadLevel(levelIdx + 1); intro(); }
  else if (a === 'menu') title();
  else if (a === 'mute') { toggleMute(); b.textContent = muted ? 'Ses: kapalı' : 'Ses: açık'; }
});
const controlsHtml = `
  <dl class="ctl only-kb">
    <dt>← → / A D</dt><dd>Yürü</dd>
    <dt>BOŞLUK / ↑</dt><dd>Zıpla (basılı tut, daha yükseğe)</dd>
    <dt>X / J</dt><dd>Ateş et (basılı tut)</dd>
    <dt>C / Q</dt><dd>Silah değiştir</dd>
    <dt>↓ + ZIPLA</dt><dd>İnce platformdan aşağı in</dd>
    <dt>P / ESC</dt><dd>Duraklat · <b>M</b> ses</dd>
  </dl>
  <dl class="ctl only-touch">
    <dt>◀ ▶</dt><dd>Yürü</dd>
    <dt>ZIPLA</dt><dd>Zıpla (basılı tut, daha yükseğe)</dd>
    <dt>ATEŞ</dt><dd>Ateş et (basılı tut)</dd>
    <dt>SİLAH</dt><dd>Silah değiştir</dd>
    <dt>▼ + ZIPLA</dt><dd>İnce platformdan aşağı in</dd>
  </dl>`;
function title() {
  state = 'title'; loadLevel(0); $('msg').textContent = '';
  show(`<h1>DEMİR<br>KAFA</h1>
    <p class="tag">Deli bilimci <b>Dr. Balçık</b> şehri yeşil mutantlarla doldurdu. Baretini tak, perçin tabancanı al; çatılardan metroya, oradan fabrikaya in.</p>
    ${controlsHtml}
    <p class="stat">Düşmanların üstüne zıplayıp ezebilirsin. Kafesteki kedileri kurtar, cıvata topla (100 cıvata = +1 can).</p>
    <button class="play" type="button" data-act="start">BAŞLA</button>
    <p class="stat">${best ? 'En iyi skor: ' + best : ''}</p>`);
}
function intro() {
  state = 'intro';
  show(`<p class="stat">${lv.name}</p><h2>${lv.title}</h2><p class="tag">${lv.goal}</p>
    <button class="play" type="button" data-act="go">HAZIRIM</button>`);
}
function pause() { if (state !== 'play') return; state = 'paused'; show(`<h2>MOLA</h2><button class="play" type="button" data-act="resume">DEVAM</button>
  <div class="row"><button class="ghost" type="button" data-act="mute">${muted ? 'Ses: kapalı' : 'Ses: açık'}</button><button class="ghost" type="button" data-act="menu">Ana menü</button></div>`); }
function resume() { if (state !== 'paused') return; state = 'play'; hide(); }
function saveBest() { if (score > best) { best = score; store.set('demirkafa.best', best); return true; } return false; }
function gameOver() {
  state = 'over'; const rec = saveBest(); sfx('die');
  show(`<h2>İŞ KAZASI!</h2><p class="big">${score}</p><p class="stat">${rec ? 'Yeni rekor!' : 'En iyi: ' + best} · ${lv.name}</p>
    <button class="play" type="button" data-act="start">TEKRAR DENE</button><div class="row"><button class="ghost" type="button" data-act="menu">Ana menü</button></div>`);
}
function levelClear() {
  if (state !== 'play') return;
  state = 'clear'; sfx('clear');
  const bonus = Math.round(P.hp) * 10; score += bonus;
  show(`<p class="stat">${lv.name}</p><h2>BÖLÜM TAMAM!</h2>
    <p class="stat">Sağlık bonusu: +${bonus} · Cıvata: ${bolts}</p><p class="big">${score}</p>
    <button class="play" type="button" data-act="next">SONRAKİ BÖLÜM</button>`);
}
function win() {
  state = 'win'; sfx('clear'); score += lives * 1000; const rec = saveBest();
  show(`<h1>ŞEHİR<br>KURTULDU!</h1><p class="tag">Dr. Balçık'ın robotu hurdaya döndü. Demir Kafa baretini çıkarıp bir çay koydu.</p>
    <p class="stat">Kalan can bonusu: +${lives * 1000}</p><p class="big">${score}</p><p class="stat">${rec ? 'Yeni rekor!' : 'En iyi: ' + best}</p>
    <button class="play" type="button" data-act="start">YENİDEN OYNA</button>`);
}
function toggleMute() { muted = !muted; store.set('demirkafa.muted', muted); if (master) master.gain.value = muted ? 0 : 0.55; $('muteBtn').textContent = muted ? '×' : '♪'; }
$('muteBtn').textContent = muted ? '×' : '♪';
$('muteBtn').addEventListener('click', () => { ensureAudio(); toggleMute(); });
$('pauseBtn').addEventListener('click', () => pause());
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

// ---------- loop ----------
let last = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  if (state === 'play') {
    if (lv.song !== undefined && !bossOn) song = lv.song;
    const n = dt > 1 / 50 ? 2 : 1;
    for (let i = 0; i < n; i++) { update(dt / n); if (i === 0) for (const k in pq) pq[k] = false; }
  } else {
    for (const k in pq) pq[k] = false;
    time += dt;
    if (state === 'title') { cam.x += 22 * dt; if (cam.x > LW * TS - VW) cam.x = 0; }
  }
  render(); updateHud();
}
window.__dk = { get state() { return state; }, get P() { return P; }, get ents() { return ents; }, loadLevel, newGame, held, pq, get lv() { return lv; }, get boss() { return boss; }, startBoss, setState(s) { state = s; refreshChrome(); } };
title();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
